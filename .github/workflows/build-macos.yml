name: Build macOS (Apple silicon + Intel)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  realtime-safety:
    # Linux-only: the RT-safety test uses GNU ld --wrap to trap malloc/new/free/mutex calls
    # made on the audio thread. The DSP and plug-in code are identical on macOS.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build tests
        run: cmake --build build -j 4 --target vbc_dsp_tests vbc_rt_safety_test
      - name: DSP + real-time safety tests
        run: ctest --test-dir build --output-on-failure

  build:
    runs-on: macos-latest   # Apple silicon runner (always a supported image)
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: DSP unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check universal binary
        run: lipo -info "build/VBC1_artefacts/Release/VST3/VBC-1 Bus Compressor.vst3/Contents/MacOS/VBC-1 Bus Compressor"

      - name: Validate VST3 with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process \
            --validate "build/VBC1_artefacts/Release/VST3/VBC-1 Bus Compressor.vst3"

      - name: Validate AU with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/VBC1_artefacts/Release/AU/VBC-1 Bus Compressor.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Vbc1 Vbca

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/VBC1_artefacts/Release/VST3/VBC-1 Bus Compressor.vst3" dist/
          cp -R "build/VBC1_artefacts/Release/AU/VBC-1 Bus Compressor.component" dist/
          cp scripts/install_mac.sh dist/
          cd dist && zip -qry ../VBC1-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: VBC1-macOS
          path: VBC1-macOS.zip
